name: Tests

# The overlay tests run headless against a scripted fake SDK, so none of this
# needs iRacing, a display or a network. They exist because the released .exe
# once shipped a panel that could be neither dragged nor closed.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyirsdk is Windows-only and the tests replace it with a fake, so
          # only the pieces the tests actually import are installed here.
          pip install PySide6-Essentials numpy PyYAML

      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Overlay window behaviour
        run: python tests/test_overlay_window.py

      - name: End-to-end session against a fake SDK
        run: python tests/test_app_smoke.py

      - name: Settings model guard
        run: python tests/test_settings_model_guard.py

      - name: The shipped vectors match the implementation
        run: |
          python tools/gen_vectors.py
          git diff --exit-code docs/integration/vectors.json \
            || (echo "::error::vectors.json is stale - run python tools/gen_vectors.py and commit it" && exit 1)

      - name: JavaScript reference port
        run: node docs/integration/verify.cjs
